case:
  name: dc_scan

runtime:
  cuda_visible_devices: "0"
  xla_preallocate: false
  # xla_memory_fraction: 0.5

paths:
  relative_to: config
  mesh: mesh/dc_scan.inp
  output_directory: ../../../../opt_output/am_solver/dc_scan
  vtk_directory: ../../../../opt_output/am_solver/dc_scan/vtk
  mesh_output: ../../../../opt_output/am_solver/dc_scan/mesh/dc_scan.vtu

mesh:
  element_type: HEX8

  # Original Abaqus mesh coordinates are in mm.
  scale_to_meter: 0.001

geometry:
  substrate_bottom_z_m: -0.0025
  bottom_tolerance_m: 0.0001

  material_interface_z_m: 0.0
  base_plate_height_m: 0.0

thermal:
  initial_temperature_c: 25.0

  convection:
    coefficient_w_m2k: 10.0
    ambient_temperature_c: 25.0

  radiation:
    stefan_boltzmann: 5.67e-8
    emissivity: 0.2
    ambient_temperature_c: 25.0

mechanics:
  fixed_plane_z_m: -0.0025
  fixed_plane_tolerance_m: 0.0001

  thermal_strain_reference_temperature_c: 20.0

phase:
  powder: 0
  liquid: 1
  solid: 2

heat_source:
  type: goldak_double_ellipsoid

  power_w: 280.0
  efficiency: 0.4

  front_radius_x_m: 0.00005
  rear_radius_x_m: 0.00005
  radius_y_m: 0.00005
  radius_z_m: 0.00005

  front_fraction: 1.0
  rear_fraction: 1.0

  surface_source:
    enabled: false
    radius_x_m: 0.00005
    radius_y_m: 0.00005

activation:
  active_radius_factor: 2.0

toolpath:
  mode: generated
  pattern: box_zigzag

  # Layerwise scanning of a 1 mm x 1 mm region; change the layer count here as needed.
  number_of_layers: 2
  layer_height_m: 0.00003

  # Cooling/waiting time after each layer.
  cooling_time_s: 200.0

  scan:
    length_x_m: 0.001
    length_y_m: 0.001
    velocity_m_s: 0.95

    tracks_per_layer: 10
    hatch_spacing_m: 0.0001

    center_x_m: 0.0
    center_y_m: 0.0

    # Scan along x in the first layer and switch to y in the second layer.
    first_layer_direction: x
    rotate_layers: true
    zigzag: true

time_stepping:
  laser_on_steps_per_segment: 10
  laser_off_steps_per_segment: 50

  # Number of thermal analysis steps between mechanical solves.
  mechanics_interval: 1

output:
  clear_vtk_directory: true

materials:
  upper_region: &in718
    name: IN718

    density_kg_m3: 8190.0
    latent_heat_j_kg: 286000.0

    # Material temperature tables in YAML use K.
    solidus_temperature_k: 1533.0
