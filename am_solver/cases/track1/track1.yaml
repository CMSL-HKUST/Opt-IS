case:
  name: track1

runtime:
  cuda_visible_devices: "0"
  xla_preallocate: false
  # xla_memory_fraction: 0.5

paths:
  relative_to: config
  mesh: mesh/track1.inp
  output_directory: ../../../../opt_output/am_solver/track1
  vtk_directory: ../../../../opt_output/am_solver/track1/vtk
  mesh_output: ../../../../opt_output/am_solver/track1/mesh/track1.vtu

mesh:
  element_type: HEX8

  # Original Abaqus mesh coordinates are in mm.
  scale_to_meter: 0.001

geometry:
  substrate_bottom_z_m: -0.011
  bottom_tolerance_m: 0.0001

  material_interface_z_m: 0.0
  base_plate_height_m: 0.0

thermal:
  initial_temperature_c: 25.0

  convection:
    coefficient_w_m2k: 20.0
    ambient_temperature_c: 25.0

  radiation:
    stefan_boltzmann: 5.67e-8
    emissivity: 0.2
    ambient_temperature_c: 25.0

mechanics:
  fixed_plane_z_m: -0.011
  fixed_plane_tolerance_m: 0.0001

  thermal_strain_reference_temperature_c: 20.0

phase:
  powder: 0
  liquid: 1
  solid: 2

heat_source:
  type: goldak_double_ellipsoid

  power_w: 600.0
  efficiency: 0.4

  front_radius_x_m: 0.0008
  rear_radius_x_m: 0.0008
  radius_y_m: 0.0008
  radius_z_m: 0.0008

  front_fraction: 1.0
  rear_fraction: 1.0

  surface_source:
    enabled: false
    radius_x_m: 0.0008
    radius_y_m: 0.0008

activation:
  active_radius_factor: 2.0

toolpath:
  mode: generated
  # track1 is a single-track validation model: one continuous scan from
  # the left edge to the right edge, followed by the configured cooling hold.
  pattern: line

  number_of_layers: 1
  layer_height_m: 0.00067

  # Keep the post-track cooling segment for the thermal history.
  cooling_time_s: 200.0

  scan:
    length_m: 0.040
    velocity_m_s: 0.006
    y_m: 0.0
    alternate_direction: false

  # Used when mode: file:
  # file: input/toolpaths/path.csv
  # delimiter: ","
  # skip_rows: 1

time_stepping:
  laser_on_steps_per_segment: 2000
  laser_off_steps_per_segment: 50

  # Number of thermal analysis steps between mechanical solves.
  mechanics_interval: 10

output:
  clear_vtk_directory: true

