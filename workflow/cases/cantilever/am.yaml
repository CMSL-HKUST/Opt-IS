      - 473.15
      - 573.15
      - 673.15
      - 823.15
      - 923.15
      - 1023.15
      - 1143.15
      values_gpa:
      - 208
      - 204
      - 198
      - 192
      - 186
      - 179
      - 170
      - 161
      - 148
    # S6 leaves beta at 20 degC blank. No zero or invented point is inserted.
    # Existing interpolation clamps below 100 degC to 5.56 micro/K (assumption).
