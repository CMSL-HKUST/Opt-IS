run_macro_model: false

case:
  name: cantilever_power80

# All relative paths are resolved from this file's directory.
paths:
  small_mesh: mesh/Job-10020.inp
  large_mesh: mesh/am25.inp
  output_directory: ../../../../opt_output/cantilever/power80

solvers:
  am_root: ../../../am_solver
  is_root: ../../../IS_solver

reference:
  displacement_scale_to_m: 0.001

execution: {}

stages:
  am:
    config: am.yaml
    overrides:
      heat_source:
        power_w: 156.0

  optimization:
    config: optimization.yaml
    require_success: false
    overrides: {}

  forward:
    config: forward.yaml
    overrides: {}
