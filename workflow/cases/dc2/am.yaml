    # Source: Ti64.pptx slide 1, isotropic SECANT thermal-expansion coefficients.
    # Conversion reference T0=20 degC: eps_th(T)=alpha_s(T)*(T-T0).
    # This table stores TANGENT alpha_t=d(eps_th)/dT=alpha_s+(T-T0)*d(alpha_s)/dT.
    # Original secant [degC: micro/K]: -233.15:6.5, -173.15:7.1, 19.85:8.9,
    # 126.85:9.7, 326.85:10.8, 526.85:11.4, 626.86:11.6, 826.86:11.6.
    # Original alpha_s is piecewise-linear, endpoint-clamped as in MaterialDatabase.
    # Its derivative jumps at knots. Encode left/right limits at +/-0.001 degC
    # to avoid smearing a jump across an entire original temperature interval.
    # Keep alpha_t endpoint-constant outside the original range. Units: micro/K.
    # T0 here is the COEFFICIENT conversion reference, not a change to birth states
