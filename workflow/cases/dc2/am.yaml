case:
  name: dc2_ti6al4v
runtime:
  cuda_visible_devices: '0'
  xla_preallocate: false
paths:
  relative_to: config
  mesh: mesh/Job-14030.inp
  output_directory: ../../../../opt_output/dc2/am
  vtk_directory: ../../../../opt_output/dc2/am/vtk
  mesh_output: ../../../../opt_output/dc2/am/mesh/Job-10030_mesh.vtu
mesh:
  element_type: HEX8
  scale_to_meter: 0.001
geometry:
  substrate_bottom_z_m: -0.001
  bottom_tolerance_m: 0.0001
  material_interface_z_m: 0.0
  base_plate_height_m: 0.0
thermal:
  initial_temperature_c: 27.0
  convection:
    coefficient_w_m2k: 55.0
    ambient_temperature_c: 27.0
  radiation:
    stefan_boltzmann: 5.67e-08
    emissivity: 0.54
    ambient_temperature_c: 27.0
mechanics:
  fixed_plane_z_m: -0.001
  fixed_plane_tolerance_m: 0.0001
  thermal_strain_reference_temperature_c: 300.0
  # Cap mechanical thermal strain at 2000 degC.
  # This is NOT the Ti64 solidus; phase/latent-heat temperatures stay unchanged.
  thermal_strain_cutoff: 2000.0
phase:
  powder: 0
  liquid: 1
  solid: 2
heat_source:
  type: goldak_double_ellipsoid
  power_w: 280.0
  efficiency: 0.5
  front_radius_x_m: 5.0e-05
  rear_radius_x_m: 5.0e-05
  radius_y_m: 5.0e-05
  radius_z_m: 9.0e-05
  front_fraction: 1.0
  rear_fraction: 1.0
  surface_source:
    enabled: false
    radius_x_m: 5.0e-05
    radius_y_m: 5.0e-05
activation:
  active_radius_factor: 2.0
toolpath:
  mode: generated
  pattern: box_zigzag
  number_of_layers: 3
  layer_height_m: 3.0e-05
  cooling_time_s: 10.0
  scan:
    # Scan the centered 0.5 mm build region, not the surrounding substrate.
    length_x_m: 7.0e-04
    length_y_m: 7.0e-04
    velocity_m_s: 1.2
    hatch_spacing_m: 1.4e-04
    center_x_m: 0.0
    center_y_m: 0.0
    first_layer_angle_degrees: 0.0
    layer_rotation_degrees: 67.0
    zigzag: true
time_stepping:
  laser_on_dt_s: 1.25e-05
  laser_off_steps_per_segment: 50
  mechanics_interval: 2
output:
  clear_vtk_directory: true
materials:
  upper_region: &id001
    # Source: Ti64.pptx, slide 1, the six embedded material-property tables.
    # Temperatures shown in degC are converted to K by adding 273.15.
    # Linear interpolation and endpoint clamping follow the existing solver.
    name: Ti-6Al-4V
    # Constant density by user choice: use the slides' 20 degC value.
    # Slides rho(T) [degC: kg/m3]: 20:4405, 1227:4243, 1777:4189,
    # 1877:3865, 2127:3730, 2500:3730. The high-T density table is NOT active.
    density_kg_m3: 4405.0
    # Slides do not specify latent heat/solidus/liquidus: retain previous values.
    latent_heat_j_kg: 270000.0
    solidus_temperature_k: 1878.0
    liquidus_temperature_k: 1928.0
